apiVersion: apps/v1
kind: Deployment
metadata:
  name: souravbuggy-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: souravbuggy
  template:
    metadata:
      labels:
        app: souravbuggy
    spec:
      containers:
      - name: souravbuggy
        image: 335523638368.dkr.ecr.ap-southeast-2.amazonaws.com/testing-ecr:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
# service type loadbalancer       
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: souravbuggy
    k8s-app: souravbuggy
  name: souravbuggy
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: 8080
  type: LoadBalancer
  selector:
    app: souravbuggy
